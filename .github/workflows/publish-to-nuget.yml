name: 'Publish SDK to NuGet'

on:
  push:
    tags: ['sdk-v*']
  pull_request:
    branches: [master]
    paths:
      - 'SDK/**'
      - 'Directory.Build.props'
      - '.github/workflows/publish-to-nuget.yml'
  workflow_dispatch:

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'

jobs:
  pack:
    name: 'Pack Nefarius.DsHidMini.IPC'
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 'Setup .NET'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 'Pack'
        run: dotnet pack SDK/Nefarius.DsHidMini.IPC -c Release -o artifacts

      - name: 'Upload package'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          if-no-files-found: error
          path: artifacts/*

  publish:
    name: 'Publish to nuget.org'
    needs: pack
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 'Download package'
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: artifacts

      - name: 'Setup .NET'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 'NuGet login (OIDC to short-lived key)'
        id: login
        uses: NuGet/login@v1
        with:
          user: Nefarius

      - name: 'Push package'
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
